[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sas2pyspark"
version = "0.1.0"
description = "SAS to PySpark migration workbench — LangGraph Python backend"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0,<0.3",
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.0,<0.4",
    "pydantic>=2.9.0,<3",
    "databricks-sdk>=0.30.0,<0.40",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "structlog>=24.4.0,<25",
    "sse-starlette>=2.1.0,<3",
    "azure-cosmos>=4.8.0,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0,<0.8",
    "mypy>=1.13.0,<2",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.27.0,<0.28",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sas2pyspark"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
packages = ["sas2pyspark"]

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "databricks_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "azure.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (gated)",
    "postgres: requires a live Postgres instance (gated)",
    "cosmos: requires an Azure Cosmos DB account (gated)",
]

[tool.coverage.run]
source = ["sas2pyspark"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
